name = "distributed_synthesis"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DistributedSynthesis", "DistributedSynthesis.Tests"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
weak.linter.style.longLine = false
weak.linter.style.header = false
weak.linter.unusedDecidableInType = false
weak.linter.unusedVariables = false
weak.linter.flexible = false
weak.linter.unnecessarySimpa = false
weak.linter.unusedSimpArgs = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "DistributedSynthesis"
